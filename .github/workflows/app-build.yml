name: App build

on:
  push:
    branches-ignore:
      - ci-results
      - deploy-results
      - app-results
    paths:
      - "app/**"
      - "scripts/fetch-keys.sh"
      - ".github/workflows/app-build.yml"
  workflow_dispatch:

permissions:
  contents: write # only used to publish logs to the app-results branch

env:
  SUPABASE_PROJECT_REF: ztprvcfwlzxycdjeektg
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android files are generated until a platform setting needs committing.
      - name: Generate the Android project
        run: |
          flutter create --project-name rms --org com.rms --platforms android . 2>&1 | tee ../create.log
          # flutter create overwrites some of our files, such as the lint rules.
          git checkout -- .
          rm -f test/widget_test.dart
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>|' "$manifest"
          sed -i 's|android:label="[^"]*"|android:label="ZAD"|' "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"

      # The launcher icon is drawn in SVG (assets/icon) and rendered here for every
      # screen density, so no image editor or committed PNGs are needed.
      - name: Render the app icon
        run: |
          sudo apt-get install -y -qq librsvg2-bin > /dev/null
          res=android/app/src/main/res
          for density in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${density%%:*}"
            size="${density##*:}"
            mkdir -p "$res/mipmap-$name"
            rsvg-convert -w "$size" -h "$size" assets/icon/zad_legacy.svg -o "$res/mipmap-$name/ic_launcher.png"
            # Adaptive layers are 108dp for a 48dp icon.
            layer=$((size * 108 / 48))
            rsvg-convert -w "$layer" -h "$layer" assets/icon/zad_foreground.svg -o "$res/mipmap-$name/ic_launcher_foreground.png"
          done
          mkdir -p "$res/mipmap-anydpi-v26" "$res/values"
          cat > "$res/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
              <monochrome android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cat > "$res/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFF4E2</color>
          </resources>
          XML
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          # A preview for the published logs, to check the result without a phone.
          rsvg-convert -w 512 -h 512 assets/icon/zad_legacy.svg -o ../icon-preview.png

      - name: Get packages
        run: |
          flutter pub get 2>&1 | tee ../pub.log
          code="${PIPESTATUS[0]}"
          # Published so it can be committed; the build cannot produce it anywhere else.
          cp pubspec.lock ../pubspec-lock.log
          exit "$code"

      - name: Analyze
        id: analyze
        run: flutter analyze --no-fatal-infos 2>&1 | tee ../analyze.log; exit "${PIPESTATUS[0]}"

      - name: Test
        id: test
        if: ${{ !cancelled() }}
        run: flutter test 2>&1 | tee ../test.log; exit "${PIPESTATUS[0]}"

      - name: Build the APK
        id: apk
        run: |
          source ../scripts/fetch-keys.sh
          [ -n "$PUBLISHABLE_KEY" ] || { echo "No publishable key"; exit 1; }
          flutter build apk --release --split-per-abi --dart-define=SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" 2>&1 | tee ../apk.log
          exit "${PIPESTATUS[0]}"

      - uses: actions/upload-artifact@v4
        if: ${{ steps.apk.outcome == 'success' }}
        with:
          name: rms-android
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Publish logs
        if: always()
        working-directory: .
        run: |
          echo "${{ github.sha }} ${{ job.status }}" > result.log
          # Refuse to publish anything that looks like a key or token.
          if grep -lE 'add-mask|eyJ[A-Za-z0-9_-]{10,}|sb_secret_|sb_publishable_|sbp_[A-Za-z0-9]+' ./*.log; then
            echo "A log looks like it contains a key. Publishing only the result." >&2
            find . -maxdepth 1 -name '*.log' ! -name result.log -delete
            echo "logs withheld: possible secret" >> result.log
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git reset -q --hard # the logs are untracked, so they stay
          git switch --orphan app-results
          git add -f ./*.log
          if [ -f icon-preview.png ]; then git add -f icon-preview.png; fi
          git commit -q -m "App logs for ${{ github.sha }}"
          # GitHub sometimes refuses a push for a moment, so try again before failing.
          for attempt in 1 2 3 4 5; do
            git push -f origin app-results && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 10))
          done
