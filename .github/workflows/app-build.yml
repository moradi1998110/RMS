name: App build

on:
  push:
    branches-ignore:
      - ci-results
      - deploy-results
      - app-results
    paths:
      - "app/**"
      - "scripts/fetch-keys.sh"
      - "scripts/prepare-android.sh"
      - ".github/workflows/app-build.yml"
  workflow_dispatch:

permissions:
  contents: write # only used to publish logs to the app-results branch

env:
  SUPABASE_PROJECT_REF: ztprvcfwlzxycdjeektg
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the build number is the count of commits.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android files are generated until a platform setting needs committing.
      - name: Generate the Android project
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          bash ../scripts/prepare-android.sh
          # A preview for the published logs, to check the icon without a phone.
          rsvg-convert -w 512 -h 512 assets/icon/zad_legacy.svg -o ../icon-preview.png

      - name: Get packages
        run: |
          flutter pub get 2>&1 | tee ../pub.log
          code="${PIPESTATUS[0]}"
          # Published so it can be committed; the build cannot produce it anywhere else.
          cp pubspec.lock ../pubspec-lock.log
          exit "$code"

      - name: Analyze
        id: analyze
        run: flutter analyze --no-fatal-infos 2>&1 | tee ../analyze.log; exit "${PIPESTATUS[0]}"

      - name: Test
        id: test
        if: ${{ !cancelled() }}
        run: flutter test 2>&1 | tee ../test.log; exit "${PIPESTATUS[0]}"

      - name: Build the APK
        id: apk
        env:
          # Gradle reads it to unlock the release key.
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          source ../scripts/fetch-keys.sh
          [ -n "$PUBLISHABLE_KEY" ] || { echo "No publishable key"; exit 1; }
          # Rises with every commit, so Android accepts each build as an update.
          build_number="$(git rev-list --count HEAD)"
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          flutter build apk --release --split-per-abi --build-number="$build_number" \
            --dart-define=APP_BUILD="$build_number" --dart-define=APP_VERSION="$version" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" 2>&1 | tee ../apk.log
          code="${PIPESTATUS[0]}"
          [ "$code" = 0 ] || exit "$code"
          # Which key signed it: ZAD's own (CN=ZAD) or Flutter's throwaway debug key.
          # Reported, never fatal: the APK is already built.
          {
            sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -1)"
            echo "signer check with: ${apksigner:-no apksigner found}"
            [ -n "$apksigner" ] && "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          } 2>&1 | grep -vE 'WARNING' | tee -a ../apk.log || true

      - uses: actions/upload-artifact@v4
        if: ${{ steps.apk.outcome == 'success' }}
        with:
          name: rms-android
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Publish logs
        if: always()
        working-directory: .
        run: |
          echo "${{ github.sha }} ${{ job.status }}" > result.log
          # Refuse to publish anything that looks like a key or token.
          if grep -lE 'add-mask|eyJ[A-Za-z0-9_-]{10,}|sb_secret_|sb_publishable_|sbp_[A-Za-z0-9]+' ./*.log; then
            echo "A log looks like it contains a key. Publishing only the result." >&2
            find . -maxdepth 1 -name '*.log' ! -name result.log -delete
            echo "logs withheld: possible secret" >> result.log
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git reset -q --hard # the logs are untracked, so they stay
          git switch --orphan app-results
          git add -f ./*.log
          if [ -f icon-preview.png ]; then git add -f icon-preview.png; fi
          git commit -q -m "App logs for ${{ github.sha }}"
          # GitHub sometimes refuses a push for a moment, so try again before failing.
          for attempt in 1 2 3 4 5; do
            git push -f origin app-results && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 10))
          done
