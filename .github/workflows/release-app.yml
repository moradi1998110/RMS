name: Release app

# Run by hand from main when a version is ready for staff. Builds the signed APKs,
# uploads them to the app-releases bucket and records the release, after which every
# phone running ZAD offers the update on its own. Merging alone releases nothing.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'ما الجديد في هذا الإصدار (يظهر للموظفين)'
        required: true
      mandatory:
        description: 'تحديث إجباري: لا يعمل التطبيق القديم حتى يُحدَّث'
        type: boolean
        default: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ztprvcfwlzxycdjeektg
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the build number is the count of commits.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          REQUIRE_SIGNING: "1"
        run: bash ../scripts/prepare-android.sh

      - name: Test
        run: |
          flutter pub get
          flutter test

      - name: Build the signed APKs
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          source ../scripts/fetch-keys.sh
          [ -n "$PUBLISHABLE_KEY" ] || { echo "No publishable key"; exit 1; }
          build_number="$(git rev-list --count HEAD)"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          flutter build apk --release --split-per-abi --build-number="$build_number" \
            --dart-define=APP_BUILD="$build_number" --dart-define=APP_VERSION="$version" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"

      - name: Upload and record the release
        env:
          NOTES: ${{ inputs.notes }}
          MANDATORY: ${{ inputs.mandatory }}
        run: |
          set -euo pipefail
          source ../scripts/fetch-keys.sh
          api="https://$SUPABASE_PROJECT_REF.supabase.co"
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          files='{}'
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed 's/^app-\(.*\)-release\.apk$/\1/')"
            path="$BUILD_NUMBER/zad-$abi.apk"
            curl -sS --fail-with-body -o /dev/null -X POST "$api/storage/v1/object/app-releases/$path" \
              -H "apikey: $SECRET_KEY" -H "Content-Type: application/vnd.android.package-archive" \
              -H "x-upsert: true" --data-binary "@$apk"
            files="$(jq --arg abi "$abi" --arg path "$path" \
              --arg sha "$(sha256sum "$apk" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$apk")" \
              '. + {($abi): {path: $path, sha256: $sha, size: $size}}' <<< "$files")"
            echo "uploaded $path"
          done
          jq -n --argjson build "$BUILD_NUMBER" --arg version "$version" --arg notes "$NOTES" \
            --argjson mandatory "$MANDATORY" --argjson files "$files" \
            '{build: $build, version: $version, notes: $notes, mandatory: $mandatory, files: $files}' |
            curl -sS --fail-with-body -o /dev/null -X POST "$api/rest/v1/app_releases" \
              -H "apikey: $SECRET_KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" -d @-
          echo "### ZAD $version ($BUILD_NUMBER) released" >> "$GITHUB_STEP_SUMMARY"
          [ "$MANDATORY" = true ] && echo "Mandatory: older builds must update." >> "$GITHUB_STEP_SUMMARY"

          # Only the newest three keep their files; older rows stay, since a mandatory
          # one still sets the oldest build allowed.
          old="$(curl -sS --fail-with-body "$api/rest/v1/app_releases?select=files&order=build.desc&offset=3" \
            -H "apikey: $SECRET_KEY")"
          prefixes="$(jq -c '[.[].files[].path]' <<< "$old")"
          if [ "$prefixes" != "[]" ]; then
            jq -n --argjson prefixes "$prefixes" '{prefixes: $prefixes}' |
              curl -sS -o /dev/null -X DELETE "$api/storage/v1/object/app-releases" \
                -H "apikey: $SECRET_KEY" -H "Content-Type: application/json" -d @-
            echo "removed the files of older releases"
          fi
