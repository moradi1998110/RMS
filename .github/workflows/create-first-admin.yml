name: Create first admin

# Run once by hand from the Actions tab after the first deploy. Then delete the
# ADMIN_PASSWORD secret; the admin changes nothing else here afterwards.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_REF: ztprvcfwlzxycdjeektg
      API_URL: https://ztprvcfwlzxycdjeektg.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_FULL_NAME: ${{ secrets.ADMIN_FULL_NAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create the admin
        shell: bash
        run: |
          source scripts/fetch-keys.sh
          bash scripts/bootstrap-admin.sh

          # Sign in and reach a function: a bad username is only refused after the
          # function has confirmed this is an admin using the project's secret key.
          token="$(jq -n --arg email "$ADMIN_USERNAME@meals.invalid" --arg password "$ADMIN_PASSWORD" '{email: $email, password: $password}' |
            curl -sS "$API_URL/auth/v1/token?grant_type=password" \
              -H "apikey: $PUBLISHABLE_KEY" -H "Content-Type: application/json" -d @- |
            jq -r '.access_token // empty')"
          [ -n "$token" ] || { echo "The new admin could not sign in"; exit 1; }
          answer="$(curl -sS "$API_URL/functions/v1/create-user" \
            -H "apikey: $PUBLISHABLE_KEY" -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" -d '{"username":"a b","full_name":"x","role":"employee"}' |
            jq -r '.error // empty')"
          echo "create-user answered: $answer"
          [ "$answer" = "invalid_username" ]
