name: Deploy to Supabase

# Runs after the tests pass on main, or by hand from the Actions tab.
on:
  workflow_run:
    workflows: ["Database tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # only used to publish logs to the deploy-results branch

env:
  SUPABASE_PROJECT_REF: ztprvcfwlzxycdjeektg
  API_URL: https://ztprvcfwlzxycdjeektg.supabase.co
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          {
            if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
              echo "Missing secrets: add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD"
              exit 1
            fi
            supabase link --project-ref "$SUPABASE_PROJECT_REF" &&
            supabase db push --remote --yes &&
            supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --yes &&
            supabase migration list --remote
          } 2>&1 | tee deploy.log

      # Self sign-up is a project setting, so set exactly this one rather than
      # pushing the whole local config.
      - name: Turn off self sign-up
        shell: bash
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"disable_signup": true}')"
          echo "auth config update: $status" | tee -a deploy.log
          [ "$status" = "200" ]

      - name: Check the live project
        shell: bash
        run: bash scripts/deploy-check.sh 2>&1 | tee check.log; exit "${PIPESTATUS[0]}"

      - name: Publish logs
        if: always()
        shell: bash
        run: |
          echo "${{ github.sha }} ${{ job.status }}" > result.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git switch --orphan deploy-results
          git add -f ./*.log
          git commit -q -m "Deploy logs for ${{ github.sha }}"
          git push -f origin deploy-results
