name: Database tests

on:
  push:
    branches-ignore:
      - ci-results
      - deploy-results
      - app-results
    paths:
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/db-tests.yml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: write # only used to publish logs to the ci-results branch

jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starting Supabase applies every migration, so a broken migration fails here.
      - name: Apply migrations
        id: migrations
        shell: bash
        run: |
          set +e
          supabase start -x studio,imgproxy,mailpit,logflare,vector,realtime,postgres-meta 2>&1 | tee start.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            message=$(grep -iE 'error|failed|at statement|line [0-9]+' start.log | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Migrations failed::$message"
          fi
          exit "$code"

      - name: Run tests
        shell: bash
        run: |
          set +e
          supabase test db 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            message=$(grep -E 'not ok|Failed test|have:|want:|caught:|wanted:|ERROR|Dubious|Result:' test.log | head -80 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Tests failed::$message"
          fi
          exit "$code"

      - name: Run concurrency tests
        if: ${{ !cancelled() && steps.migrations.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          bash scripts/concurrency-test.sh 2>&1 | tee concurrency.log
          exit "${PIPESTATUS[0]}"

      - name: Run account tests
        if: ${{ !cancelled() && steps.migrations.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          supabase functions serve > functions.log 2>&1 &
          url="$(supabase status -o env | grep '^API_URL=' | cut -d'"' -f2)/functions/v1/create-user"
          for attempt in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url")"
            [ "$status" = "401" ] && break
            sleep 3
          done
          echo "functions answered with $status after $attempt attempts"
          bash scripts/accounts-test.sh 2>&1 | tee accounts.log
          exit "${PIPESTATUS[0]}"

      - name: Check the demo data script
        if: ${{ !cancelled() && steps.migrations.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          sed 's/emp1@meals/demo-a@meals/' scripts/demo-data.sql > /tmp/demo-first.sql
          sed 's/emp1@meals/demo-b@meals/' scripts/demo-data.sql > /tmp/demo-second.sql
          {
            psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -X -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into auth.users (id, email) values (gen_random_uuid(), 'demo-a@meals.invalid'), (gen_random_uuid(), 'demo-b@meals.invalid');
          \i /tmp/demo-first.sql
          \i /tmp/demo-second.sql
          select 'offerings', count(*) from public.meal_offerings o join public.restaurants r on r.id = o.restaurant_id where r.name = 'مطعم تجريبي';
          select p.username, w.available, u.email_confirmed_at is not null as confirmed from public.wallets w join public.profiles p on p.id = w.employee_id join auth.users u on u.id = p.id where p.username in ('demo-a', 'demo-b');
          do $$ begin
            if not exists (select 1 from public.meal_offerings o join public.restaurants r on r.id = o.restaurant_id where r.name = 'مطعم تجريبي') then
              raise exception 'The demo data produced no offerings';
            end if;
            if (select count(*) from public.restaurants where name = 'مطعم تجريبي') <> 1 then
              raise exception 'The second run made another restaurant';
            end if;
            if (select count(*) from public.wallets w join public.profiles p on p.id = w.employee_id join auth.users u on u.id = p.id where p.username in ('demo-a', 'demo-b') and w.available = 100000 and u.email_confirmed_at is not null) <> 2 then
              raise exception 'An employee was not set up';
            end if;
          end $$;
          rollback;
          SQL
          } 2>&1 | tee demo.log
          exit "${PIPESTATUS[0]}"

      # Keeps the latest logs readable with plain git, on a branch of their own.
      - name: Publish logs
        if: always()
        shell: bash
        run: |
          echo "${{ github.sha }} ${{ job.status }}" > result.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git switch --orphan ci-results
          git add -f ./*.log
          git commit -q -m "Test logs for ${{ github.sha }}"
          # GitHub sometimes refuses a push for a moment, so try again before failing.
          for attempt in 1 2 3 4 5; do
            git push -f origin ci-results && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 10))
          done
