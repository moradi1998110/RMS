name: Database tests

on:
  push:
    branches-ignore:
      - ci-results
  workflow_dispatch:

permissions:
  contents: write # only used to publish logs to the ci-results branch

jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starting Supabase applies every migration, so a broken migration fails here.
      - name: Apply migrations
        id: migrations
        shell: bash
        run: |
          set +e
          supabase start -x studio,imgproxy,mailpit,logflare,vector,realtime,storage-api,postgres-meta 2>&1 | tee start.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            message=$(grep -iE 'error|failed|at statement|line [0-9]+' start.log | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Migrations failed::$message"
          fi
          exit "$code"

      - name: Run tests
        shell: bash
        run: |
          set +e
          supabase test db 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            message=$(grep -E 'not ok|Failed test|have:|want:|caught:|wanted:|ERROR|Dubious|Result:' test.log | head -80 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Tests failed::$message"
          fi
          exit "$code"

      - name: Run concurrency tests
        if: ${{ !cancelled() && steps.migrations.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          bash scripts/concurrency-test.sh 2>&1 | tee concurrency.log
          exit "${PIPESTATUS[0]}"

      - name: Run account tests
        if: ${{ !cancelled() && steps.migrations.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          supabase functions serve > functions.log 2>&1 &
          url="$(supabase status -o env | grep '^API_URL=' | cut -d'"' -f2)/functions/v1/create-user"
          for attempt in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url")"
            [ "$status" = "401" ] && break
            sleep 3
          done
          echo "functions answered with $status after $attempt attempts"
          bash scripts/accounts-test.sh 2>&1 | tee accounts.log
          exit "${PIPESTATUS[0]}"

      # Keeps the latest logs readable with plain git, on a branch of their own.
      - name: Publish logs
        if: always()
        shell: bash
        run: |
          echo "${{ github.sha }} ${{ job.status }}" > result.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git switch --orphan ci-results
          git add -f ./*.log
          git commit -q -m "Test logs for ${{ github.sha }}"
          git push -f origin ci-results
