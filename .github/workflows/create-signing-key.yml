name: Create signing key

# Run once, by hand, after adding the ANDROID_SIGNING_PASSWORD secret. Creates ZAD's
# Android signing key and commits it encrypted with that password, so every build can
# sign with the same key and each new version installs over the last.
#
# Losing the password means no phone can ever update again without reinstalling: keep
# a copy of it outside GitHub. Refuses to run if a key already exists.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE to make the key'
        required: true

permissions:
  contents: write # commits the encrypted key

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create and encrypt the key
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "CREATE" ] || { echo "Type CREATE to confirm." >&2; exit 1; }
          [ -n "$ANDROID_SIGNING_PASSWORD" ] || { echo "Add the ANDROID_SIGNING_PASSWORD secret first." >&2; exit 1; }
          [ "${#ANDROID_SIGNING_PASSWORD}" -ge 20 ] || { echo "The password must be at least 20 characters." >&2; exit 1; }
          encrypted=app/signing/zad-upload.jks.enc
          if [ -f "$encrypted" ]; then
            echo "A key already exists. Replacing it would stop every phone from updating." >&2
            exit 1
          fi
          mkdir -p app/signing
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/zad.jks" -storetype PKCS12 \
            -alias zad -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass:env ANDROID_SIGNING_PASSWORD -keypass:env ANDROID_SIGNING_PASSWORD \
            -dname "CN=ZAD, O=ZAD, C=IQ" > /dev/null
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$RUNNER_TEMP/zad.jks" -out "$encrypted" \
            -pass env:ANDROID_SIGNING_PASSWORD
          # Proves the committed file opens with the same password.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$encrypted" -pass env:ANDROID_SIGNING_PASSWORD |
            cmp - "$RUNNER_TEMP/zad.jks"
          rm -f "$RUNNER_TEMP/zad.jks"

      - name: Commit the encrypted key
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/signing/zad-upload.jks.enc
          git commit -m "Add ZAD's encrypted Android signing key"
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 10))
          done
